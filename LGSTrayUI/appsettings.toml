[UI]
enableRichToolTips = true

[NumericDisplay]
# Font size as a multiplier of the icon size (default: 0.8)
fontSizeMultiplier = 0.8
# Text color: "#RRGGBB" or a named color (e.g. "white"). Leave empty to use the system theme color.
textColor = ""
# Background color: "#RRGGBB" or a named color. Leave empty for transparent.
backgroundColor = ""


[HTTPServer]
enabled = true
addr = "localhost"
port = 12321
useIpv6 = true

[GHub]
enabled = true

[Native]
enabled = true

# Time in seconds to retry a device poll on failure
retryTime = 10

# Time in seconds to next device poll on sucess
pollPeriod = 600

# List of disabled devices
disabledDevices = [
]